<div
    class="z-40 shadow-header"
    [ngClass]="{ 'dark text-white-dark': store.semidark && store.menu === 'horizontal'}"
>
    <div
        class="relative flex w-full items-center justify-between bg-primary px-5 py-1 dark:bg-[#0e1726]"
    >
        <div
            class="horizontal-logo flex items-center justify-between ltr:mr-2 rtl:ml-2"
        >
            <a
                href="javascript:;"
                class="collapse-icon flex items-center justify-center flex-none rounded-full bg-white-light/40 size-10 hover:bg-white-light/90 hover:text-primary dark:bg-dark/40 dark:text-[#d0d2d6] dark:hover:bg-dark/60 dark:hover:text-primary"
                (click)="storeData.dispatch({type: 'toggleSidebar'})"
            >
                <img
                    src="../assets/images/toggle-sidebar.svg"
                    class="rtl:rotate-180"
                    alt=""
                />
            </a>
            <a routerLink="/" class="main-logo flex shrink-0 items-center">
                <img
                    class="inline w-16 ltr:ml-5 rtl:mr-5"
                    src="/assets/images/header-logo.png"
                    alt=""
                />
            </a>
        </div>
        <div
            class="flex items-center justify-between space-x-4 rtl:space-x-reverse p-4"
        >
            <!-- Language Toggle -->
            <div *ngIf="translate.currentLang === 'ar'">
                <button
                    type="button"
                    class="w-full text-primary-light dark:text-white-light hover:underline"
                    (click)="changeLanguage({ code: 'en', name: 'English' })"
                >
                    <span>English</span>
                </button>
            </div>
            <div *ngIf="translate.currentLang === 'en'">
                <button
                    type="button"
                    class="w-full text-primary-light dark:text-white-light hover:underline"
                    (click)="changeLanguage({ code: 'ar', name: 'Arabic' })"
                >
                    <span>العربية</span>
                </button>
            </div>
        </div>
    </div>
</div>
