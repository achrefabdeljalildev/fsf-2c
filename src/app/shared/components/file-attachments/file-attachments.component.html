<div class="panel rounded-md p-4 h-full">
    <div class="flex justify-between w-full items-center">
        <h6 class="text-md font-semibold text-lg p-2 gap-2 flex items-center">
            <i class="pi pi-file"></i>
            المرفقات
        </h6>
        <div class="flex items-center gap-2">
            <button
                type="button"
                class="btn btn-sm btn-success"
                (click)="triggerFileInput()"
                [disabled]="disableActions"
            >
                <i class="pi pi-file-plus"></i>
            </button>
            <input
                #fileInput
                type="file"
                class="hidden"
                [attr.multiple]="allowMultiple ? '' : null"
                (change)="onFileSelected($event)"
            />
        </div>
    </div>

    <p class="text-sm text-gray-500 mt-2" *ngIf="helperText">{{ helperText }}</p>

    <div *ngIf="attachments.length; else emptyState" class="flex gap-4 items-center py-4 flex-col">
        <div
            *ngFor="let file of attachments; trackBy: trackByAttachment"
            class="flex justify-between w-full items-center bg-lightBlue p-4 rounded-md"
        >
            <div class="flex gap-3 items-center w-full">
                <div *ngIf="!file.isUploading" class="flex items-center gap-3 w-full">
                    <i class="pi" [ngClass]="getIcon(file)"></i>
                    <div class="flex-1">
                        <div class="font-semibold">{{ file.name }}</div>
                        <div class="text-xs text-gray-500" *ngIf="file.size">
                            {{ formatSize(file.size) }}
                        </div>
                    </div>
                </div>
                <div *ngIf="file.isUploading" class="flex items-center gap-3 w-full">
                    <i class="pi pi-spin pi-spinner"></i>
                    <div class="flex-1">
                        <div class="font-semibold">{{ file.name }}</div>
                        <div class="w-full bg-gray-200 rounded h-1 mt-1">
                            <div
                                class="bg-blue-500 h-1 rounded transition-all"
                                [style.width.%]="file.uploadProgress"
                            ></div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="flex gap-2 items-center">
                <button
                    type="button"
                    class="btn btn-sm btn-outline-primary"
                    (click)="handleDownload(file)"
                    [disabled]="disableActions || file.isUploading"
                >
                    <i class="pi pi-download"></i>
                </button>
                <button
                    type="button"
                    class="btn btn-sm btn-outline-danger"
                    (click)="handleRemove(file)"
                    [disabled]="disableActions || file.isUploading"
                >
                    <i class="pi pi-trash"></i>
                </button>
            </div>
        </div>
    </div>

    <ng-template #emptyState>
        <div class="text-gray-500 text-sm mt-4">لا توجد مرفقات بعد.</div>
    </ng-template>
</div>
