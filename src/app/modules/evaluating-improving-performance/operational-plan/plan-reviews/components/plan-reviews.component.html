<p-breadcrumb
    [model]="[
        { label: ('breadcrumbs.securitySystems' | translate), routerLink: '/' },
        { label: ('breadcrumbs.performanceEvaluationAndDevelopmentDivision' | translate) },
        { label: ('breadcrumbs.operationalPlan' | translate) },
        { label: ('breadcrumbs.planDetails' | translate) },
        { label: ('breadcrumbs.planReviews' | translate) },
    ]"
/>
<div class="bg-[#f5f6f8] min-h-screen p-6" dir="rtl">
    <div class="bg-[#f3f5f7] min-h-screen p-6" dir="rtl">
        <div class="bg-[#d9ecee] rounded-2xl p-8 relative overflow-hidden">
            <div class="flex justify-between mb-8">
                <div class="text-teal-800 font-bold text-lg">الضباط المناوبين</div>
                <div class="text-teal-800 font-bold text-lg xl:mr-32 lg:mr-20 mr-6 ml-[34rem]">
                    الدورات الإستباقية
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-6">
                <div class="bg-white rounded-2xl p-8 text-center shadow-sm">
                    <div class="text-5xl font-extrabold text-teal-800 leading-none">16</div>
                    <div class="mt-3 text-sm text-gray-500">المطلوبين للخطة التشغيلية</div>
                </div>

                <div class="bg-teal-800 text-white rounded-2xl p-8 text-center shadow-sm">
                    <div class="text-5xl font-extrabold leading-none">08</div>
                    <div class="mt-3 text-sm opacity-90">المتاح حاليا</div>
                </div>

                <div class="bg-white rounded-2xl p-8 text-center shadow-sm">
                    <div class="text-5xl font-extrabold text-teal-800 leading-none">09</div>
                    <div class="mt-3 text-sm text-gray-500">المطلوبين للخطة التشغيلية</div>
                </div>

                <div class="bg-teal-800 text-white rounded-2xl p-8 text-center shadow-sm">
                    <div class="text-5xl font-extrabold leading-none">04</div>
                    <div class="mt-3 text-sm opacity-90">المتاح حاليا</div>
                </div>
            </div>

            <div class="flex items-center gap-2 mt-8">
                <div class="w-2.5 h-2.5 bg-teal-800 rounded-full"></div>
                <div class="w-2.5 h-2.5 bg-gray-300 rounded-full"></div>
                <div class="w-2.5 h-2.5 bg-gray-300 rounded-full"></div>
                <div class="w-2.5 h-2.5 bg-gray-300 rounded-full"></div>
            </div>

            <div class="absolute left-6 bottom-6 flex gap-3">
                <button
                    class="w-10 h-10 bg-teal-800 text-white rounded-full shadow flex items-center justify-center hover:bg-teal-700 transition"
                    routerLink="/plan-details/list"
                >
                    ‹
                </button>
                <button
                    class="w-10 h-10 bg-white rounded-full shadow flex items-center justify-center text-gray-500 hover:bg-gray-100 transition"
                >
                    ›
                </button>
            </div>
        </div>

        <div class="bg-gray-50 rounded-3xl shadow-md p-8 mt-8">
            <div class="mb-6">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center gap-3">
                        <button
                            class="bg-teal-700 text-white px-5 py-2 rounded-xl text-sm font-semibold flex items-center gap-2"
                        >
                            <i class="pi pi-users"></i>
                            الموجود الفعلي
                        </button>

                        <div class="flex items-center gap-2 text-gray-600 text-sm cursor-pointer">
                            <i class="pi pi-cog text-lg"></i>
                            دراسة العمليات
                        </div>
                    </div>
                </div>

                <div class="w-full mb-6">
                    <h5 class="w-full text-right text-lg font-semibold text-gray-800">
                        المرشحين للتنطيق على الموقع
                    </h5>
                </div>
            </div>

            <div class="flex items-center justify-between mb-8">
                <div class="relative w-80">
                    <input
                        type="text"
                        [(ngModel)]="search"
                        placeholder="الرقم المرجعي ، اسم الإدارة"
                        class="w-full border rounded-lg h-10 pr-10 pl-3 text-sm focus:outline-none focus:ring-2 focus:ring-teal-600"
                    />
                    <i
                        class="pi pi-search absolute right-3 top-1/2 -translate-y-1/2 text-gray-400"
                    ></i>
                </div>

                <div class="flex items-center gap-2">
                    <button
                        class="w-9 h-9 border rounded-lg flex items-center justify-center bg-white"
                    >
                        <i class="pi pi-list"></i>
                    </button>

                    <button
                        class="w-9 h-9 border rounded-lg flex items-center justify-center bg-teal-700 text-white"
                    >
                        <i class="pi pi-th-large"></i>
                    </button>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div
                    *ngFor="let item of candidates"
                    class="bg-white rounded-2xl shadow-sm p-5 transition hover:shadow-md"
                >
                    <div class="flex justify-between items-center mb-3">
                        <div class="text-sm text-gray-500">
                            {{ item.code }}
                        </div>

                        <img [src]="item.image" class="w-10 h-10 rounded-full object-cover" />
                    </div>

                    <div class="font-semibold text-gray-800 text-base">
                        {{ item.name }}
                    </div>

                    <div class="flex flex-wrap gap-2 mt-2">
                        <span
                            *ngFor="let dept of item.departments"
                            class="bg-gray-100 text-gray-600 text-xs px-3 py-1 rounded-full"
                        >
                            {{ dept }}
                        </span>
                    </div>

                    <div class="flex items-center gap-3 mt-5">
                        <button
                            class="bg-teal-700 text-white px-4 py-2 rounded-lg text-sm flex items-center gap-2"
                        >
                            <i class="pi pi-check"></i>
                            تطبيق
                        </button>

                        <button
                            class="border px-4 py-2 rounded-lg text-sm text-gray-600 flex items-center gap-2"
                        >
                            <i class="pi pi-user"></i>
                            الملف الشخصي
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
