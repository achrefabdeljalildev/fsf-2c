<p-breadcrumb
    [model]="[
        { label: ('breadcrumbs.securitySystems' | translate), routerLink: '/' },
        { label: ('breadcrumbs.performanceEvaluationAndDevelopmentDivision' | translate) },
        { label: ('breadcrumbs.operationalPlan' | translate) },
        { label: ('breadcrumbs.listOfSites' | translate) },
    ]"
/>
<div class="w-full bg-white border rounded-xl px-8 py-6">
    <div class="relative flex items-center justify-between" dir="rtl">
        <div
            class="absolute top-[18px] h-[2.5px] bg-slate-200"
            style="right: calc(50% / 6); left: calc(50% / 6)"
        ></div>

        <div
            class="absolute top-[18px] h-[2.5px] bg-teal-500 transition-all duration-300"
            [style.right]="startOffset"
            [style.width.%]="progressWidth"
        ></div>

        <ng-container *ngFor="let step of steps; let i = index">
            <div class="relative z-10 flex flex-col items-center flex-1">
                <div
                    class="w-9 h-9 rounded-full bg-white border flex items-center justify-center text-sm font-semibold"
                    [ngClass]="{
                        'border-teal-500 text-teal-600': step.id <= currentStep,
                        'border-slate-300 text-slate-400': step.id > currentStep,
                    }"
                >
                    {{ step.id }}
                </div>

                <span
                    class="mt-2 text-sm"
                    [ngClass]="{
                        'text-slate-700': step.id <= currentStep,
                        'text-slate-400': step.id > currentStep,
                    }"
                >
                    {{ step.label }}
                </span>
            </div>
        </ng-container>
    </div>
</div>
