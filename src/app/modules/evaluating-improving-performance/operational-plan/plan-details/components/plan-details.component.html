<p-breadcrumb
    [model]="[
        { label: ('breadcrumbs.securitySystems' | translate), routerLink: '/' },
        { label: ('breadcrumbs.performanceEvaluationAndDevelopmentDivision' | translate) },
        { label: ('breadcrumbs.operationalPlan' | translate) },
        { label: ('breadcrumbs.planDetails' | translate) },
    ]"
/>
<div class="w-full bg-white rounded-xl shadow-sm p-8" dir="rtl">
    <div class="flex items-center justify-start gap-2 mb-6" dir="ltr">
        <button
            *ngFor="let tab of tabs; let i = index"
            (click)="activeTab = i"
            class="px-6 py-2 rounded-md font-semibold transition"
            [ngClass]="activeTab === i ? 'bg-amber-400 text-white' : 'bg-gray-200 text-gray-700'"
        >
            {{ tab }}
        </button>
    </div>

    <hr class="mb-8" />

    <div class="flex items-center justify-between mb-8">
        <div>
            <h2 class="text-2xl font-bold text-gray-800">
                {{ locationData.title }}
            </h2>
            <div class="text-gray-600 mt-2 text-lg font-semibold">
                {{ locationData.code }}
            </div>
        </div>

        <div class="flex items-center gap-3">
            <button class="flex items-center gap-2 px-4 py-2 border rounded-md text-gray-700">
                تعديل
                <i class="pi pi-pencil"></i>
            </button>

            <button class="flex items-center gap-2 px-4 py-2 bg-teal-700 text-white rounded-md">
                تصدير
                <i class="pi pi-download"></i>
            </button>
            <button
                class="flex items-center gap-2 px-4 py-2 bg-teal-700 text-white rounded-md"
                routerLink="/location-card/list"
            >
                بطاقة الموقع
                <i class="pi pi-id-card"></i>
            </button>
            <button
                class="flex items-center gap-2 px-4 py-2 bg-teal-700 text-white rounded-md"
                routerLink="/plan-reviews/list"
            >
                مراجعات الخطة
                <i class="pi pi-check-square"></i>
            </button>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
        <div *ngFor="let field of locationFields">
            <label class="block mb-2 text-sm font-semibold text-gray-700">
                {{ field.label }}
            </label>

            <input
                type="text"
                class="w-full bg-gray-100 rounded-md p-3 border border-gray-200"
                [value]="field.value"
                disabled
            />
        </div>
    </div>

    <div class="flex flex-wrap gap-6 justify-center">
        <div
            *ngFor="let card of infoCards"
            class="bg-teal-700 text-white rounded-2xl px-10 py-8 text-center min-w-[240px]"
        >
            <div
                class="w-10 h-10 mx-auto mb-4 rounded-full bg-white text-teal-700 flex items-center justify-center"
            >
                <i class="pi" [ngClass]="card.icon"></i>
            </div>

            <div class="text-lg font-semibold">
                {{ card.title }}
            </div>

            <div class="mt-2 text-sm">
                {{ card.value }}
            </div>
        </div>
    </div>
    <div class="mt-12 space-y-8">
        <div class="bg-white rounded-xl shadow-sm p-6">
            <h3 class="text-xl font-bold text-gray-800 mb-6 text-right">الهيكل الإداري</h3>

            <ng-datatable
                [rows]="rows"
                [columns]="cols"
                [sortable]="false"
                [loading]="isLoading"
                [pagination]="true"
                [pageSize]="criteria.pageSize"
                noDataContent="{{ 'common.noDataOnList' | translate }}"
            >
            </ng-datatable>
        </div>

        <div class="bg-white rounded-xl shadow-sm p-6">
            <h3 class="text-xl font-bold text-gray-800 mb-6 text-right">توزيع الأفراد</h3>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <h4 class="text-teal-700 font-semibold mb-3 text-right">
                        توزيع النقاط الأمنية
                    </h4>

                    <ng-datatable
                        [rows]="securityDistributionRows"
                        [columns]="distributionCols"
                        [sortable]="false"
                        [loading]="false"
                        [pagination]="false"
                        class="rounded-lg overflow-hidden"
                    >
                    </ng-datatable>
                </div>

                <div>
                    <h4 class="text-teal-700 font-semibold mb-3 text-right">توزيع الدوريات</h4>

                    <ng-datatable
                        [rows]="patrolDistributionRows"
                        [columns]="distributionCols"
                        [sortable]="false"
                        [loading]="false"
                        [pagination]="false"
                        class="rounded-lg overflow-hidden"
                    >
                    </ng-datatable>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm p-6">
            <h3 class="text-xl font-bold text-gray-800 mb-6 text-right">الهيكل القيادي</h3>

            <ng-datatable
                [rows]="leadershipRows"
                [columns]="leadershipCols"
                [sortable]="false"
                [loading]="false"
                [pagination]="false"
                class="rounded-lg overflow-hidden"
            >
            </ng-datatable>
        </div>
    </div>
</div>
