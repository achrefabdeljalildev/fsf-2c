<p-breadcrumb
    [model]="[
        { label: ('breadcrumbs.generalAdministration' | translate), routerLink: '/' },
        { label: ('breadcrumbs.FieldProtectionMnagement' | translate), routerLink: '/' },
        { label: ('breadcrumbs.approvalsCenter' | translate), routerLink: '/' },
    ]"
/>

<main-content [isPanel]="false">
    <div class="w-full bg-[#dbecee] rounded-2xl p-8">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
            <div
                *ngFor="let s of stats"
                class="bg-white rounded-2xl shadow-sm flex flex-col items-center justify-center py-10"
            >
                <div class="text-5xl font-extrabold text-teal-800 leading-none">
                    {{ s.value }}
                </div>

                <div class="text-gray-600 text-sm font-semibold mt-3">
                    {{ s.label }}
                </div>
            </div>
        </div>
    </div>

    <div dir="rtl" class="bg-white border-b border-gray-200 px-8 py-4 mb-6">
        <div class="flex items-center justify-between">
            <div class="flex items-center gap-10 text-sm font-semibold">
                <div class="relative text-teal-700 pb-2 border-b-2 border-teal-700 cursor-pointer">
                    المواقع
                    <span
                        class="absolute -top-2 -right-6 bg-amber-400 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full"
                    >
                        12
                    </span>
                </div>

                <div class="relative text-gray-600 hover:text-teal-700 cursor-pointer">
                    المسح المكتبي
                    <span
                        class="absolute -top-2 -right-6 bg-amber-400 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full"
                    >
                        08
                    </span>
                </div>

                <div class="relative text-gray-600 hover:text-teal-700 cursor-pointer">
                    المسح الميداني
                    <span
                        class="absolute -top-2 -right-6 bg-amber-400 text-white text-[10px] w-5 h-5 flex items-center justify-center rounded-full"
                    >
                        08
                    </span>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <div class="relative w-80">
                    <input
                        type="text"
                        placeholder="الرقم المرجعي ، اسم الإدارة"
                        class="w-full border rounded-lg h-10 pr-10 pl-3 text-sm focus:outline-none focus:ring-2 focus:ring-teal-600"
                    />
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-gray-400"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-width="2"
                            d="M21 21l-4.35-4.35M16.65 10.5A6.15 6.15 0 1110.5 4.35a6.15 6.15 0 016.15 6.15z"
                        />
                    </svg>
                </div>

                <button class="px-5 h-10 rounded-lg bg-teal-700 text-white flex items-center gap-2">
                    تصفية
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="w-4 h-4"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path stroke-linecap="round" stroke-width="2" d="M3 4h18M6 12h12M10 20h4" />
                    </svg>
                </button>

                <button
                    class="w-10 h-10 border rounded-lg flex items-center justify-center bg-white text-gray-600"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="w-4 h-4"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path
                            stroke-linecap="round"
                            stroke-width="2"
                            d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"
                        />
                    </svg>
                </button>

                <button
                    class="w-10 h-10 border rounded-lg flex items-center justify-center bg-white text-gray-600"
                >
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="w-4 h-4"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path stroke-linecap="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                    </svg>
                </button>
            </div>
        </div>
    </div>
    <div dir="rtl" class="space-y-6">
        <div
            *ngFor="let item of requests"
            class="bg-white rounded-2xl border border-gray-200 shadow-sm p-6"
        >
            <div>
                <div class="space-y-3">
                    <div class="flex items-center gap-2 justify-end">
                        <span
                            class="px-3 py-1.5 text-xs rounded-full flex items-center gap-1.5 font-semibold border"
                            [ngClass]="{
                                'bg-blue-100 text-blue-700 border-blue-200':
                                    item.status === 'draft',
                                'bg-orange-100 text-orange-700 border-orange-200':
                                    item.status === 'pending',
                            }"
                        >
                            <svg
                                xmlns="http://www.w3.org/2000/svg"
                                class="w-3.5 h-3.5"
                                fill="none"
                                stroke="currentColor"
                                viewBox="0 0 24 24"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-width="2"
                                    d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
                                />
                            </svg>
                            منذ يوم
                        </span>

                        <span
                            class="px-3 py-1.5 text-xs rounded-full bg-gray-100 text-gray-700 border border-gray-200 flex items-center gap-1.5 font-semibold"
                        >
                            <img
                                src="/assets/images/icons/lacation-logo-black.svg"
                                class="w-3.5 h-3.5"
                            />
                            طلب إضافة موقع جديد
                        </span>

                        <span
                            class="px-3 py-1.5 text-xs rounded-full text-white font-semibold"
                            [ngClass]="{
                                'bg-red-700': item.status === 'draft',
                                'bg-green-700': item.status === 'pending',
                            }"
                        >
                            {{ item.status === 'draft' ? 'المسودة' : 'منتهية' }}
                        </span>
                    </div>

                    <div class="text-teal-700 font-extrabold text-xl tracking-wide">
                        {{ item.id }}
                    </div>

                    <div class="flex items-center gap-2 mt-1">
                        <svg
                            xmlns="http://www.w3.org/2000/svg"
                            class="w-4 h-4 text-amber-500"
                            fill="currentColor"
                            viewBox="0 0 24 24"
                        >
                            <path
                                d="M3 3h13v18H3V3zm15 4h3v14h-3V7zM6 6h7v2H6V6zm0 4h7v2H6v-2zm0 4h7v2H6v-2z"
                            />
                        </svg>

                        <div class="text-gray-900 font-medium text-base">
                            {{ item.company }}
                        </div>
                    </div>

                    <div class="text-gray-600 text-sm leading-6 mt-1">
                        {{ item.description }}
                    </div>

                    <div class="flex flex-col gap-2 mt-3">
                        <div class="flex flex-wrap gap-2">
                            <span
                                class="px-3 py-1 text-xs bg-gray-100 text-gray-700 rounded-md border"
                            >
                                {{ item.city }}
                            </span>

                            <span
                                class="px-3 py-1 text-xs bg-blue-50 text-blue-700 rounded-md border border-blue-200"
                            >
                                {{ item.category }}
                            </span>
                        </div>

                        <div>
                            <span
                                class="px-3 py-1 text-xs bg-red-50 text-red-700 rounded-md border border-red-300 inline-flex items-center gap-1"
                            >
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    class="w-3 h-3"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-width="2"
                                        d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"
                                    />
                                </svg>

                                {{ item.date }}
                            </span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="border-t my-5"></div>

            <div class="mb-4">
                <div class="flex items-center gap-3">
                    <div class="text-right">
                        <div class="text-sm font-semibold text-gray-700">
                            {{ item.user }}
                        </div>
                        <div class="text-xs text-gray-400">
                            {{ item.role }}
                        </div>
                    </div>

                    <img [src]="item.avatar" class="w-10 h-10 rounded-full border object-cover" />
                </div>
            </div>

            <div class="flex items-center gap-2 justify-end">
                <button
                    *ngIf="item.status === 'draft'"
                    class="flex items-center gap-2 px-4 py-2 rounded-lg bg-teal-600 text-white hover:bg-teal-700 transition"
                >
                    اعتماد
                </button>

                <button
                    *ngIf="item.status === 'draft'"
                    class="flex items-center gap-2 px-4 py-2 rounded-lg border border-red-200 text-red-500 hover:bg-red-50 transition"
                >
                    رفض
                </button>

                <button
                    class="px-4 py-2 rounded-lg border bg-gray-50 hover:bg-gray-100 transition text-gray-700"
                >
                    تفاصيل الطلب
                </button>
            </div>
        </div>
    </div>
</main-content>
