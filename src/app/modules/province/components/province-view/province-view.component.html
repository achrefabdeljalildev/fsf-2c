<p-dialog
    [(visible)]="visible"
    [header]="isEditMode ? 'تعديل محافظة' : 'إضافة محافظة جديدة'"
    [modal]="true"
    [style]="{ width: '50vw' }"
    [breakpoints]="{ '960px': '75vw', '640px': '90vw' }"
    (onHide)="closeDialog()"
>
    <form [formGroup]="provinceForm" (ngSubmit)="submit()" class="space-y-6">
        <!-- Name in Arabic -->
        <div class="form-group">
            <label for="nameAr" class="block text-sm font-medium mb-2">
                الاسم
                <span class="text-red-500">*</span>
            </label>
            <input
                id="nameAr"
                type="text"
                formControlName="nameAr"
                pInputText
                class="w-full"
                placeholder="أدخل اسم المحافظة "
            />
            <small
                *ngIf="
                    provinceForm.get('nameAr')?.invalid &&
                    (provinceForm.get('nameAr')?.dirty || provinceForm.get('nameAr')?.touched)
                "
                class="text-red-500"
            >
                <span *ngIf="provinceForm.get('nameAr')?.errors?.['required']">
                    هذا الحقل مطلوب
                </span>
            </small>
        </div>

        <!-- Description in Arabic -->
        <div class="form-group">
            <label for="descriptionAr" class="block text-sm font-medium mb-2"> الوصف </label>
            <textarea
                id="descriptionAr"
                formControlName="descriptionAr"
                pInputTextarea
                rows="5"
                class="w-full"
                placeholder="أدخل وصف المحافظة "
            ></textarea>
            <small
                *ngIf="
                    provinceForm.get('descriptionAr')?.invalid &&
                    (provinceForm.get('descriptionAr')?.dirty ||
                        provinceForm.get('descriptionAr')?.touched)
                "
                class="text-red-500"
            >
                <span *ngIf="provinceForm.get('descriptionAr')?.errors?.['required']">
                    هذا الحقل مطلوب
                </span>
            </small>
        </div>
    </form>

    <ng-template pTemplate="footer">
        <div class="flex justify-end gap-2">
            <button
                type="button"
                class="btn bg-gray-50 hover:bg-gray-100 text-gray-700"
                (click)="closeDialog()"
                [disabled]="isLoading"
            >
                إلغاء
            </button>
            <button
                type="button"
                class="btn btn-primary"
                (click)="submit()"
                [disabled]="provinceForm.invalid || isLoading"
            >
                {{ isEditMode ? 'حفظ ' : 'إضافة' }}
            </button>
        </div>
    </ng-template>
</p-dialog>
