<p-dialog
    [(visible)]="visible"
    [header]="
        isEditMode ? ('actions.editRegion' | translate) : ('actions.addNewRegion' | translate)
    "
    [modal]="true"
    [style]="{ width: '50vw' }"
    [breakpoints]="{ '960px': '75vw', '640px': '90vw' }"
    (onHide)="closeDialog()"
>
    <form [formGroup]="regionForm" (ngSubmit)="submit()" class="space-y-6">
        <!-- Name in Arabic -->
        <div class="form-group">
            <label for="nameAr" class="block text-sm font-medium mb-2">
                {{ 'formLabels.name' | translate }}
                <span class="text-red-500">*</span>
            </label>
            <input
                id="nameAr"
                type="text"
                formControlName="nameAr"
                pInputText
                class="w-full"
                [placeholder]="'formLabels.enterName' | translate"
            />
            <small
                *ngIf="
                    regionForm.get('nameAr')?.invalid &&
                    (regionForm.get('nameAr')?.dirty || regionForm.get('nameAr')?.touched)
                "
                class="text-red-500"
            >
                <span *ngIf="regionForm.get('nameAr')?.errors?.['required']">
                    {{ 'messages.requiredField' | translate }}
                </span>
            </small>
        </div>

        <!-- Description in Arabic -->
        <div class="form-group">
            <label for="descriptionAr" class="block text-sm font-medium mb-2">
                {{ 'formLabels.description' | translate }}
            </label>
            <textarea
                id="descriptionAr"
                formControlName="descriptionAr"
                pInputTextarea
                rows="5"
                class="w-full"
                [placeholder]="'formLabels.enterDescription' | translate"
            ></textarea>
            <small
                *ngIf="
                    regionForm.get('descriptionAr')?.invalid &&
                    (regionForm.get('descriptionAr')?.dirty ||
                        regionForm.get('descriptionAr')?.touched)
                "
                class="text-red-500"
            >
                <span *ngIf="regionForm.get('descriptionAr')?.errors?.['required']">
                    {{ 'messages.requiredField' | translate }}
                </span>
            </small>
        </div>
    </form>

    <ng-template pTemplate="footer">
        <div class="flex justify-end gap-2">
            <button
                type="button"
                class="btn bg-gray-50 hover:bg-gray-100 text-gray-700"
                (click)="closeDialog()"
                [disabled]="isLoading"
            >
                {{ 'buttons.cancel' | translate }}
            </button>
            <button
                type="button"
                class="btn btn-primary"
                (click)="submit()"
                [disabled]="regionForm.invalid || isLoading"
            >
                {{ isEditMode ? ('buttons.save' | translate) : ('buttons.add' | translate) }}
            </button>
        </div>
    </ng-template>
</p-dialog>
