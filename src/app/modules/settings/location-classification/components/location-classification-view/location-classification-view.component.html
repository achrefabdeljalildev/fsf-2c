<p-dialog
    [(visible)]="visible"
    [header]="
        isEditMode
            ? ('actions.editClassification' | translate)
            : ('actions.addNewClassification' | translate)
    "
    [modal]="true"
    [style]="{ width: '50vw' }"
    [breakpoints]="{ '960px': '75vw', '640px': '90vw' }"
    (onHide)="closeDialog()"
>
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">
        <div class="grid grid-cols-3 gap-4">
            <div class="col-span-2 form-group">
                <label for="nameAr"
                    >{{ 'formLabels.name' | translate }} <span class="text-red-500">*</span></label
                >
                <input id="nameAr" type="text" formControlName="nameAr" pInputText class="w-full" />
                <small
                    *ngIf="
                        form.get('nameAr')?.invalid &&
                        (form.get('nameAr')?.dirty || form.get('nameAr')?.touched)
                    "
                    class="text-red-500"
                    >{{ 'messages.requiredField' | translate }}</small
                >
            </div>
            <div class="form-group">
                <label for="color">{{ 'locationClassification.color' | translate }}</label>
                <input id="color" type="color" formControlName="color" class="w-full h-10" />
            </div>
        </div>

        <div class="form-group">
            <label for="descriptionAr">{{ 'formLabels.description' | translate }}</label>
            <textarea
                id="descriptionAr"
                rows="4"
                formControlName="descriptionAr"
                class="w-full"
                pInputTextarea
            ></textarea>
        </div>
    </form>

    <ng-template pTemplate="footer">
        <div class="flex justify-end gap-2">
            <button
                type="button"
                class="btn bg-gray-50 hover:bg-gray-100 text-gray-700"
                (click)="closeDialog()"
                [disabled]="isLoading"
            >
                {{ 'buttons.cancel' | translate }}
            </button>
            <button
                type="button"
                class="btn btn-primary"
                (click)="submit()"
                [disabled]="form.invalid || isLoading"
            >
                {{ isEditMode ? ('buttons.save' | translate) : ('buttons.add' | translate) }}
            </button>
        </div>
    </ng-template>
</p-dialog>
