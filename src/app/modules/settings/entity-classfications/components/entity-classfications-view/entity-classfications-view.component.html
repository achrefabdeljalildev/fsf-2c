<p-breadcrumb
    class="mb-4"
    [model]="[
        { label: ('breadcrumbs.securitySystems' | translate) },
        { label: ('breadcrumbs.generalAdministration' | translate) },
        { label: ('breadcrumbs.fieldSurveyAdmin' | translate) },
        {
            label: ('entityClassification.entityClassificationList' | translate),
            routerLink: '/entity-classification/list',
        },
        {
            label: isEditMode
                ? ('actions.editClassification' | translate)
                : ('actions.addNewClassification' | translate),
        },
    ]"
/>

<main-content>
    <div class="flex items-center justify-between mb-6">
        <div>
            <h2 class="text-xl font-semibold text-gray-900">
                {{
                    isEditMode
                        ? ('actions.editClassification' | translate)
                        : ('actions.addNewClassification' | translate)
                }}
            </h2>
        </div>
    </div>

    <div class="card p-6">
        <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">
            <!-- Name in Arabic -->
            <div class="form-group">
                <label for="nameAr" class="block text-sm font-medium mb-2">
                    {{ 'formLabels.name' | translate }}
                    <span class="text-red-500">*</span>
                </label>
                <input
                    id="nameAr"
                    type="text"
                    formControlName="nameAr"
                    pInputText
                    class="w-full"
                    [placeholder]="'formLabels.enterName' | translate"
                />
                <small
                    *ngIf="
                        form.get('nameAr')?.invalid &&
                        (form.get('nameAr')?.dirty || form.get('nameAr')?.touched)
                    "
                    class="text-red-500"
                >
                    <span *ngIf="form.get('nameAr')?.errors?.['required']">{{
                        'messages.requiredField' | translate
                    }}</span>
                </small>
            </div>

            <!-- Description in Arabic -->
            <div class="form-group">
                <label for="descriptionAr" class="block text-sm font-medium mb-2">
                    {{ 'formLabels.description' | translate }}
                </label>
                <textarea
                    id="descriptionAr"
                    formControlName="descriptionAr"
                    pInputTextarea
                    rows="5"
                    class="w-full"
                    [placeholder]="'formLabels.enterDescription' | translate"
                ></textarea>
                <small
                    *ngIf="
                        form.get('descriptionAr')?.invalid &&
                        (form.get('descriptionAr')?.dirty || form.get('descriptionAr')?.touched)
                    "
                    class="text-red-500"
                >
                    <span *ngIf="form.get('descriptionAr')?.errors?.['required']">{{
                        'messages.requiredField' | translate
                    }}</span>
                </small>
            </div>

            <div class="flex justify-end gap-2 pt-4">
                <button
                    type="button"
                    class="btn bg-gray-50 hover:bg-gray-100 text-gray-700"
                    [disabled]="isLoading"
                >
                    {{ 'buttons.cancel' | translate }}
                </button>
                <button
                    type="submit"
                    class="btn btn-primary"
                    [disabled]="form.invalid || isLoading"
                >
                    {{ isEditMode ? ('buttons.save' | translate) : ('buttons.add' | translate) }}
                </button>
            </div>
        </form>
    </div>
</main-content>
