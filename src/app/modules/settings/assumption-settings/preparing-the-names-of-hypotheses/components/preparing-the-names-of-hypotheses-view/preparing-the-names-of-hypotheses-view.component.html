<p-dialog
    [(visible)]="visible"
    [header]="
        isEditMode
            ? ('GeneralSettings.EditHypothesisTitles' | translate)
            : ('assumptionSettings.addNewHypothesisTitles' | translate)
    "
    [modal]="true"
    [style]="{ width: '50vw' }"
    [breakpoints]="{ '960px': '75vw', '640px': '90vw' }"
    (onHide)="closeDialog()"
>
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">
        <!-- Hypothesis Selection -->
        <div class="form-group">
            <label for="HypotheseTypeId" class="block text-sm font-medium mb-2">
                {{ 'assumptionSettings.typeOfHypothesis' | translate }}
                <span class="text-red-500">*</span>
            </label>
            <p-autocomplete
                id="HypotheseTypeId"
                formControlName="HypotheseTypeId"
                [suggestions]="filteredHypotheses"
                (completeMethod)="searchHypotheses($event)"
                optionLabel="nameAr"
                optionValue="id"
                [dropdown]="true"
                [placeholder]="'assumptionSettings.ChooseTheTypeOfHypothesis' | translate"
                [style]="{ width: '100%' }"
            >
            </p-autocomplete>
            <small
                *ngIf="
                    form.get('HypotheseTypeId')?.invalid &&
                    (form.get('HypotheseTypeId')?.dirty || form.get('HypotheseTypeId')?.touched)
                "
                class="text-red-500"
            >
                <span *ngIf="form.get('HypotheseTypeId')?.errors?.['required']">
                    {{ 'messages.requiredField' | translate }}
                </span>
            </small>
        </div>

        <!-- Name in Arabic -->
        <div class="form-group">
            <label for="nameAr" class="block text-sm font-medium mb-2">
                {{ 'assumptionSettings.nameAr' | translate }}
                <span class="text-red-500">*</span>
            </label>
            <input
                id="nameAr"
                type="text"
                formControlName="nameAr"
                pInputText
                class="w-full"
                [placeholder]="'assumptionSettings.enterNameAr' | translate"
            />
            <small
                *ngIf="
                    form.get('nameAr')?.invalid &&
                    (form.get('nameAr')?.dirty || form.get('nameAr')?.touched)
                "
                class="text-red-500"
            >
                <span *ngIf="form.get('nameAr')?.errors?.['required']">
                    {{ 'messages.requiredField' | translate }}
                </span>
            </small>
        </div>

        <button
            type="button"
            pButton
            pRipple
            [label]="'assumptionSettings.cancel' | translate"
            icon="pi pi-times"
            class="p-button-text"
            (click)="closeDialog()"
        ></button>
        <button
            type="submit"
            pButton
            pRipple
            [label]="'assumptionSettings.save' | translate"
            icon="pi pi-check"
            [loading]="isLoading"
            [disabled]="form.invalid || isLoading"
        ></button>
    </form>
</p-dialog>
