<!-- Top Menu Bar -->
<div class="bg-primary text-white px-8 py-1">
    <div class="flex justify-between items-center gap-4 text-white">
        <!-- Right Menu (now on right in RTL) -->
        <div class="flex gap-4">
            <span class="flex items-center gap-2">
                <i class="pi pi-calendar"></i>
                <span>9 ديسمبر 2025</span>
            </span>
            <span class="flex items-center gap-2">
                <i class="pi pi-clock"></i>
                <span>09:00</span>
            </span>
            <span class="flex items-center gap-2">
                <i class="pi pi-map-marker"></i>
                <span>الرياض</span>
            </span>
        </div>
    </div>
</div>
<div class="bg-white border-b border-gray-200 px-8">
    <div class="flex justify-between items-center gap-4 h-full">
        <div class="flex gap-4 h-full">
            <img src="assets/images/logo.png" alt="Logo" class="h-10" />
        </div>

        <div class="flex gap-4 h-full">
            <div
                class="hover:bg-primary hover:text-white cursor-pointer flex items-center gap-1 px-2 py-4 rounded"
            >
                <i class="pi pi-search"></i>
                <span>بحث</span>
            </div>
            <div
                class="flex items-center hover:bg-primary hover:text-white cursor-pointer flex items-center gap-1 px-2 py-4 rounded"
            >
                <i class="pi pi-cog"></i>
                <span>الإعدادات</span>
            </div>
            <div
                class="flex items-center hover:bg-primary hover:text-white cursor-pointer flex items-center gap-1 px-2 py-4 rounded"
            >
                <i class="pi pi-language"></i>
                <span (click)="toggleLanguage()">
                    {{ isArabeMode() ? 'عربي' : 'English' }}
                </span>
            </div>
        </div>
    </div>
</div>

<!-- Hero Section -->
<div
    class="bg-gradient-to-r from-teal-700 to-teal-800 py-16 px-8 text-center text-white relative overflow-hidden"
>
    <div class="absolute inset-0 opacity-10 pattern-bg"></div>
    <div class="relative z-10 max-w-4xl mx-auto">
        <h1 class="text-4xl font-bold mb-4">الأنظمة الأمنية</h1>
        <p class="text-lg text-teal-100">
            هنا يمكنك تخصيص وصف أ رابعة أسطر هنا يمكنك تخصيص وصف و أ رابعة أسطر
            هنا يمكنك تخصيص وصف.
        </p>
    </div>
</div>

<!-- Cards Grid -->
<div class="px-8 py-12">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <!-- All Cards -->
        <div
            *ngFor="let card of cards"
            class="bg-white cursor-pointer p-8 rounded-lg shadow-sm hover:shadow-md transition-shadow border border-gray-100"
        >
            <div class="flex flex-col items-center text-center mb-6">
                <div
                    class="bg-teal-600 px-5 py-4 rounded-full mb-4 hover:bg-teal-700 text-white transition-colors"
                >
                    <i class="pi pi-address-book"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-3">
                    {{ card.title }}
                </h3>
            </div>
            <p class="text-gray-600 text-sm mb-6 text-right">
                {{ card.description }}
            </p>
            <div class="flex justify-end">
                <i class="pi pi-arrow-left"></i>
            </div>
        </div>
    </div>
</div>
