<header [hasBreadcrumb]="false"></header>

<!-- Hero Section -->
<div
    class="bg-gradient-to-r from-[#042424] to-[#0E8A8A] py-16 px-8 text-center text-white relative overflow-hidden"
>
    <div class="relative z-10 max-w-4xl mx-auto">
        <h1 class="text-4xl font-bold mb-4">الأنظمة الأمنية</h1>
        <p class="text-lg text-teal-100">
            هنا يمكنك تخصيص وصف أ رابعة أسطر هنا يمكنك تخصيص وصف و أ رابعة أسطر
            هنا يمكنك تخصيص وصف.
        </p>
    </div>

    <img
        class="absolute right-6 top-0 h-full"
        src="assets/images/lines-effect.png"
        alt=""
    />
</div>

<!-- Cards Grid -->
<div class="px-8 py-12">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <!-- All Cards -->
        <div
            *ngFor="let card of cards"
            (click)="navigateTo('/services')"
            class="bg-white cursor-pointer p-8 rounded-lg shadow-sm hover:shadow-md transition-shadow border border-gray-100"
        >
            <div class="flex flex-col items-center text-center mb-6">
                <div
                    class="bg-teal-600 px-5 py-4 rounded-full mb-4 hover:bg-teal-700 text-white transition-colors"
                >
                    <i class="pi pi-address-book"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-3">
                    {{ card.title }}
                </h3>
            </div>
            <p class="text-gray-600 text-sm mb-6 text-right">
                هنا يمكنك تخصيص وصف أ رابعة أسطر هنا يمكنك تخصيص وصف و أ رابعة
                أسطر هنا يمكنك تخصيص وصف.
            </p>
            <div class="flex justify-end">
                <i class="pi pi-arrow-left"></i>
            </div>
        </div>
    </div>
</div>
