<!-- Hero Section -->
<div
    class="bg-gradient-to-r from-teal-700 to-teal-800 py-16 px-8 text-center text-white relative overflow-hidden"
>
    <div class="absolute inset-0 opacity-10 pattern-bg"></div>
    <div class="relative z-10 max-w-4xl mx-auto">
        <h1 class="text-4xl font-bold mb-4">الأنظمة الأمنية</h1>
        <p class="text-lg text-teal-100">
            هنا يمكنك تخصيص وصف أ رابعة أسطر هنا يمكنك تخصيص وصف و أ رابعة أسطر
            هنا يمكنك تخصيص وصف.
        </p>
    </div>
</div>

<!-- Cards Grid -->
<div class="px-8 py-12">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
        <!-- All Cards -->
        <div
            *ngFor="let card of cards"
            class="bg-white cursor-pointer p-8 rounded-lg shadow-sm hover:shadow-md transition-shadow border border-gray-100"
        >
            <div class="flex flex-col items-center text-center mb-6">
                <div class="bg-teal-600 p-4 rounded-full mb-4">
                    <svg
                        class="w-8 h-8 text-white"
                        fill="currentColor"
                        viewBox="0 0 24 24"
                    >
                        <path [attr.d]="card.icon" />
                    </svg>
                </div>
                <h3 class="text-xl font-bold text-gray-800 mb-3">
                    {{ card.title }}
                </h3>
            </div>
            <p class="text-gray-600 text-sm mb-6 text-right">
                {{ card.description }}
            </p>
            <div class="flex justify-end">
                <i class="fa fa-arrow-left"></i>
            </div>
        </div>
    </div>
</div>
