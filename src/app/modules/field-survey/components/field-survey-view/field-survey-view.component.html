<p-breadcrumb
    [model]="[
        { label: ('breadcrumbs.securitySystems' | translate), routerLink: '/' },
        { label: ('breadcrumbs.generalAdministration' | translate), routerLink: '/' },
        { label: ('fieldSurvey.fieldSurvey' | translate) },
        {
            label: ('fieldSurvey.fieldSurveyListShort' | translate),
            routerLink: '/field-survey/list',
        },
        {
            label: isEditMode
                ? ('fieldSurvey.editSurvey' | translate)
                : ('fieldSurvey.addNewSurvey' | translate),
        },
    ]"
/>

<div class="mt-6">
    <form [formGroup]="fieldSurveyForm" (ngSubmit)="submit()" class="space-y-6 flex flex-col">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Main Information Grid -->
            <div class="panel gap-4 col-span-2 flex flex-col">
                <!-- Form Actions -->
                <div class="flex gap-2">
                    <button
                        type="button"
                        class="btn bg-gray-50 hover:bg-gray-100 text-gray-700"
                        (click)="cancel()"
                        [disabled]="isLoading"
                    >
                        إلغاء
                    </button>
                    <button
                        type="submit"
                        class="btn btn-primary"
                        [disabled]="fieldSurveyForm.invalid || isLoading"
                    >
                        {{ isEditMode ? 'حفظ' : 'إضافة' }}
                    </button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <!-- add field survey name -->
                    <div class="form-group col-span-2">
                        <label for="nameAr" class="block text-sm font-medium mb-2">
                            اسم المسح
                            <span class="text-red-500">*</span>
                        </label>
                        <input
                            id="nameAr"
                            type="text"
                            formControlName="nameAr"
                            pInputText
                            class="w-full"
                            placeholder="اسم المسح"
                        />
                    </div>

                    <!-- رمز الموقع - Survey Code -->
                    <div class="form-group col-span-2">
                        <label for="locationCode" class="block text-sm font-medium mb-2">
                            رمز الموقع
                            <span class="text-red-500">*</span>
                        </label>
                        <div class="flex gap-2">
                            <input
                                id="locationCode"
                                type="text"
                                formControlName="locationCode"
                                pInputText
                                class="w-full"
                                placeholder="بحث برمز الموقع"
                                (keyup.enter)="searchByCode()"
                            />
                            <button
                                type="button"
                                class="btn btn-primary"
                                (click)="searchByCode()"
                                [disabled]="isLoading"
                            >
                                <i class="pi pi-search"></i>
                            </button>
                        </div>
                    </div>

                    <!-- اسم الموقع - Location Name -->
                    <div class="form-group">
                        <label for="locationNameAr" class="block text-sm font-medium mb-2">
                            اسم الموقع
                            <span class="text-red-500">*</span>
                        </label>
                        <input
                            id="locationNameAr"
                            type="text"
                            formControlName="locationNameAr"
                            pInputText
                            class="w-full"
                            placeholder="اسم الموقع"
                        />
                    </div>

                    <!-- الجهة - Entity -->
                    <div class="form-group">
                        <label for="organization" class="block text-sm font-medium mb-2"
                            >الجهة</label
                        >
                        <input
                            id="organization"
                            type="text"
                            formControlName="organization"
                            pInputText
                            class="w-full"
                            placeholder="الجهة"
                        />
                    </div>

                    <!-- المنطقة - Region -->
                    <div class="form-group">
                        <label for="region" class="block text-sm font-medium mb-2">المنطقة</label>
                        <input
                            id="region"
                            type="text"
                            formControlName="region"
                            pInputText
                            class="w-full"
                            placeholder="المنطقة"
                        />
                    </div>

                    <!-- المحافظة - Province -->
                    <div class="form-group">
                        <label for="province" class="block text-sm font-medium mb-2">
                            المحافظة
                        </label>
                        <input
                            id="province"
                            type="text"
                            formControlName="province"
                            pInputText
                            class="w-full"
                            placeholder="المحافظة"
                        />
                    </div>
                </div>
            </div>
            <div class="col-span-1">
                <app-file-attachments
                    [attachments]="attachments"
                    helperText="الحد الأقصى لحجم الملف هو 2 ميجابايت والصيغ المدعومة: jpg, png, pdf."
                    [entityName]="'FieldSurvey'"
                    [entityKey]="fieldSurveyId ? fieldSurveyId.toString() : ''"
                    [path]="'FieldSurvey'"
                    [category]="'Documents'"
                    [itemsPerPage]="3"
                    (fileAdded)="onFileAdded($event)"
                    (download)="onAttachmentDownload($event)"
                    (remove)="onAttachmentRemove($event)"
                    (uploadSuccess)="onUploadSuccess($event)"
                    (uploadError)="onUploadError($event)"
                ></app-file-attachments>
            </div>
        </div>
        <!-- Details Tabs (similar placement to Location view) -->
        <p-tabs value="0">
            <p-tablist>
                <p-tab *ngFor="let tab of classificationTabs; let i = index" [value]="i.toString()">
                    {{ tab.nameAr }}
                </p-tab>
                <p-tab *ngIf="isEditMode" [value]="classificationTabs.length.toString()"
                    >سجل الإجراءات</p-tab
                >
            </p-tablist>
            <p-tabpanels>
                <p-tabpanel
                    *ngFor="let tab of classificationTabs; let i = index"
                    [value]="i.toString()"
                >
                    <div class="p-4">
                        <ng-container *ngIf="tab.children && tab.children.length > 0">
                            <div class="space-y-6">
                                <div *ngFor="let child of tab.children" class="panel p-4">
                                    <h4
                                        class="font-semibold text-gray-900 mb-4 text-lg border-b pb-2"
                                    >
                                        {{ child.nameAr }}
                                    </h4>

                                    <ng-container
                                        *ngIf="
                                            child.entityClassficationForms &&
                                            child.entityClassficationForms.length > 0
                                        "
                                    >
                                        <div class="space-y-4">
                                            <div
                                                *ngFor="let form of child.entityClassficationForms"
                                                class="form-group"
                                            >
                                                <div class="flex items-start gap-3">
                                                    <!-- Checkbox if isCheckBox is true -->
                                                    <div
                                                        *ngIf="form.isCheckBox"
                                                        class="flex items-center pt-1"
                                                    >
                                                        <p-checkbox
                                                            [binary]="true"
                                                            [formControlName]="
                                                                'form_' + form.id + '_checkbox'
                                                            "
                                                        />
                                                    </div>

                                                    <!-- Form Label/Text -->
                                                    <div class="flex-1">
                                                        <label
                                                            class="block text-sm font-medium mb-1"
                                                        >
                                                            {{ form.nameAr }}
                                                        </label>

                                                        <!-- Text Input if isText is true -->
                                                        <input
                                                            *ngIf="form.isText"
                                                            type="text"
                                                            pInputText
                                                            class="w-full"
                                                            [placeholder]="'ملاحظة'"
                                                            [formControlName]="'form_' + form.id"
                                                        />
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </ng-container>

                                    <div
                                        *ngIf="
                                            !child.entityClassficationForms ||
                                            child.entityClassficationForms.length === 0
                                        "
                                        class="text-sm text-gray-500 italic"
                                    >
                                        لا توجد نماذج لهذا التصنيف
                                    </div>
                                </div>
                            </div>
                        </ng-container>

                        <div
                            *ngIf="!tab.children || tab.children.length === 0"
                            class="text-center py-8 text-gray-500"
                        >
                            <i class="pi pi-info-circle text-3xl mb-2"></i>
                            <p>لا توجد عناصر فرعية لـ {{ tab.nameAr }}</p>
                        </div>
                    </div>
                </p-tabpanel>

                <p-tabpanel [value]="classificationTabs.length.toString()">
                    <div class="p-4">
                        <app-logs-list
                            *ngIf="fieldSurveyId"
                            tableName="FieldSurveies"
                            [tableKey]="fieldSurveyId"
                            class="w-full"
                        />
                        <div *ngIf="!fieldSurveyId" class="text-sm text-gray-500">
                            سيتم عرض السجل بعد حفظ المسح.
                        </div>
                    </div>
                </p-tabpanel>
            </p-tabpanels>
        </p-tabs>
    </form>
</div>
