<p-breadcrumb
    [model]="[
        { label: 'الأنظمة الأمنية' },
        { label: 'الإدارة العامة لحماية المنشآت' },
        { label: 'المسح الميداني' },
        { label: 'قائمة المسح الميداني', routerLink: '/field-survey/list' },
        { label: isEditMode ? 'تعديل مسح' : 'إضافة مسح جديد' },
    ]"
/>

<div class="mt-6">
    <form [formGroup]="fieldSurveyForm" (ngSubmit)="submit()" class="space-y-6 flex flex-col">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Main Information Grid -->
            <div class="panel gap-4 col-span-2 flex flex-col">
                <!-- Form Actions -->
                <div class="flex gap-2">
                    <button
                        type="button"
                        class="btn bg-gray-50 hover:bg-gray-100 text-gray-700"
                        (click)="cancel()"
                        [disabled]="isLoading"
                    >
                        إلغاء
                    </button>
                    <button
                        type="submit"
                        class="btn btn-primary"
                        [disabled]="fieldSurveyForm.invalid || isLoading"
                    >
                        {{ isEditMode ? 'حفظ' : 'إضافة' }}
                    </button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <!-- add field survey name -->
                    <div class="form-group col-span-2">
                        <label for="nameAr" class="block text-sm font-medium mb-2">
                            اسم المسح
                            <span class="text-red-500">*</span>
                        </label>
                        <input
                            id="nameAr"
                            type="text"
                            formControlName="nameAr"
                            pInputText
                            class="w-full"
                            placeholder="اسم المسح"
                        />
                    </div>

                    <!-- رمز الموقع - Survey Code -->
                    <div class="form-group col-span-2">
                        <label for="locationCode" class="block text-sm font-medium mb-2">
                            رمز الموقع
                            <span class="text-red-500">*</span>
                        </label>
                        <div class="flex gap-2">
                            <input
                                id="locationCode"
                                type="text"
                                formControlName="locationCode"
                                pInputText
                                class="w-full"
                                placeholder="AZ-6543 09"
                                (keyup.enter)="searchByCode()"
                            />
                            <button
                                type="button"
                                class="btn btn-primary"
                                (click)="searchByCode()"
                                [disabled]="isLoading"
                            >
                                <i class="pi pi-search"></i>
                            </button>
                        </div>
                    </div>

                    <!-- اسم الموقع - Location Name -->
                    <div class="form-group">
                        <label for="locationNameAr" class="block text-sm font-medium mb-2">
                            اسم الموقع
                            <span class="text-red-500">*</span>
                        </label>
                        <input
                            id="locationNameAr"
                            type="text"
                            formControlName="locationNameAr"
                            pInputText
                            class="w-full"
                            placeholder="اسم الموقع"
                        />
                    </div>

                    <!-- الجهة - Entity -->
                    <div class="form-group">
                        <label for="organization" class="block text-sm font-medium mb-2"
                            >الجهة</label
                        >
                        <input
                            id="organization"
                            type="text"
                            formControlName="organization"
                            pInputText
                            class="w-full"
                            placeholder="الجهة"
                        />
                    </div>

                    <!-- المنطقة - Region -->
                    <div class="form-group">
                        <label for="region" class="block text-sm font-medium mb-2">المنطقة</label>
                        <input
                            id="region"
                            type="text"
                            formControlName="region"
                            pInputText
                            class="w-full"
                            placeholder="المنطقة"
                        />
                    </div>

                    <!-- المحافظة - Province -->
                    <div class="form-group">
                        <label for="province" class="block text-sm font-medium mb-2">
                            المحافظة
                        </label>
                        <input
                            id="province"
                            type="text"
                            formControlName="province"
                            pInputText
                            class="w-full"
                            placeholder="المحافظة"
                        />
                    </div>
                </div>
            </div>
            <div class="col-span-1 flex flex-col gap-4">
                <app-file-attachments
                    [attachments]="attachments"
                    helperText="الحد الأقصى لحجم الملف هو 2 ميجابايت والصيغ المدعومة: jpg, png, pdf."
                    [entityName]="'FieldSurvey'"
                    [entityKey]="fieldSurveyId ? fieldSurveyId.toString() : ''"
                    [path]="'FieldSurvey'"
                    [category]="'Documents'"
                    [itemsPerPage]="5"
                    (fileAdded)="onFileAdded($event)"
                    (download)="onAttachmentDownload($event)"
                    (remove)="onAttachmentRemove($event)"
                    (uploadSuccess)="onUploadSuccess($event)"
                    (uploadError)="onUploadError($event)"
                ></app-file-attachments>
            </div>
        </div>
        <!-- Details Tabs (similar placement to Location view) -->
        <p-tabs value="0">
            <p-tablist>
                <p-tab value="4">سياج الموقع</p-tab>
                <p-tab value="3">بوابات الموقع</p-tab>
                <p-tab value="2">طرق الدوريات</p-tab>
                <p-tab value="1">التجربيات في موقع الرصاص</p-tab>
                <p-tab value="0">التجريبات في نقطة الفرز المتقدمة</p-tab>
                <p-tab value="5">سجل الإجراءات</p-tab>
            </p-tablist>
            <p-tabpanels>
                <p-tabpanel value="0">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- غرفة حراسة - Guard Room -->
                        <div class="form-group">
                            <label for="roomType" class="block text-sm font-medium mb-2">
                                غرفة حراسة
                            </label>
                            <p-autocomplete
                                formControlName="roomType"
                                [dropdown]="true"
                                [suggestions]="['نوعها', 'نوع آخر']"
                                placeholder="نوعها"
                                [style]="{ width: '100%' }"
                            />
                        </div>

                        <!-- مساحتها - Area -->
                        <div class="form-group">
                            <label for="area" class="block text-sm font-medium mb-2">
                                مساحتها
                            </label>
                            <input
                                id="area"
                                type="text"
                                formControlName="area"
                                pInputText
                                class="w-full"
                                placeholder="مساحتها"
                            />
                        </div>

                        <!-- تجربات أخرى - Other Experiments -->
                        <div class="form-group col-span-2">
                            <label for="otherExperiments" class="block text-sm font-medium mb-2">
                                تجربات أخرى
                            </label>
                            <textarea
                                id="otherExperiments"
                                formControlName="otherExperiments"
                                pInputTextarea
                                rows="4"
                                class="w-full"
                                placeholder="تجربات أخرى"
                            ></textarea>
                        </div>
                    </div>
                </p-tabpanel>

                <p-tabpanel value="1">
                    <div class="p-4">
                        <p class="text-gray-600">محتوى التجربيات في موقع الرصاص</p>
                    </div>
                </p-tabpanel>

                <p-tabpanel value="2">
                    <div class="p-4">
                        <p class="text-gray-600">محتوى طرق الدوريات</p>
                    </div>
                </p-tabpanel>

                <p-tabpanel value="3">
                    <div class="p-4">
                        <p class="text-gray-600">محتوى بوابات الموقع</p>
                    </div>
                </p-tabpanel>

                <p-tabpanel value="4">
                    <div class="p-4">
                        <p class="text-gray-600">محتوى سياج الموقع</p>
                    </div>
                </p-tabpanel>

                <p-tabpanel value="5">
                    <div class="p-4">
                        <app-logs-list
                            *ngIf="fieldSurveyId"
                            tableName="FieldSurveys"
                            [tableKey]="fieldSurveyId"
                            class="w-full"
                        ></app-logs-list>
                        <div *ngIf="!fieldSurveyId" class="text-sm text-gray-500">
                            سيتم عرض السجل بعد حفظ المسح.
                        </div>
                    </div>
                </p-tabpanel>
            </p-tabpanels>
        </p-tabs>
    </form>
</div>
