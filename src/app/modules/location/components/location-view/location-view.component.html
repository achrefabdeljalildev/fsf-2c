<p-breadcrumb
    [model]="[
        { label: ('breadcrumbs.securitySystems' | translate), routerLink: '/' },
        { label: ('breadcrumbs.generalAdministration' | translate), routerLink: '/' },
        { label: ('location.locationList' | translate), routerLink: '/location/list' },
        {
            label: isEditMode
                ? ('location.editLocation' | translate)
                : ('location.addNewLocation' | translate),
        },
    ]"
/>

<div class="mt-6">
    <form [formGroup]="locationForm" (ngSubmit)="submit()" class="space-y-6 flex flex-col">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Main Information Grid -->

            <div class="panel gap-4 col-span-2 flex flex-col">
                <!-- Form Actions -->
                <div class="flex gap-2">
                    <button
                        type="button"
                        class="btn bg-gray-50 hover:bg-gray-100 text-gray-700"
                        (click)="cancel()"
                        [disabled]="isLoading"
                    >
                        إلغاء
                    </button>
                    <button
                        type="submit"
                        class="btn btn-primary"
                        [disabled]="locationForm.invalid || isLoading"
                    >
                        {{
                            isEditMode ? ('buttons.save' | translate) : ('buttons.add' | translate)
                        }}
                    </button>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <!-- رمز الموقع - Location Code -->
                    <div class="form-group">
                        <label for="code" class="block text-sm font-medium mb-2">
                            {{ 'formLabels.locationCode' | translate }}
                            <span class="text-red-500">*</span>
                        </label>
                        <div class="relative flex items-center">
                            <input
                                id="code"
                                [type]="showLocationCode ? 'text' : 'password'"
                                formControlName="code"
                                pInputText
                                class="w-full"
                                [placeholder]="'formLabels.locationCode' | translate"
                            />
                            <button
                                type="button"
                                class="absolute left-3 text-gray-600 hover:text-gray-900 focus:outline-none"
                                (click)="showLocationCode = !showLocationCode"
                                [title]="
                                    showLocationCode ? 'Hide location code' : 'Show location code'
                                "
                            >
                                <i [class]="showLocationCode ? 'pi pi-eye-slash' : 'pi pi-eye'"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Name in Arabic -->
                    <div class="form-group">
                        <label for="nameAr" class="block text-sm font-medium mb-2">
                            {{ 'formLabels.name' | translate }}
                            <span class="text-red-500">*</span>
                        </label>
                        <input
                            id="nameAr"
                            type="text"
                            formControlName="nameAr"
                            pInputText
                            class="w-full"
                            [placeholder]="'formLabels.name' | translate"
                        />
                    </div>

                    <!-- Region -->
                    <div class="form-group">
                        <label for="regionId" class="block text-sm font-medium mb-2">{{
                            'formLabels.region' | translate
                        }}</label>
                        <p-select
                            formControlName="regionId"
                            [options]="filteredRegions"
                            optionLabel="nameAr"
                            optionValue="id"
                            [placeholder]="'formLabels.selectRegion' | translate"
                            [style]="{ width: '100%' }"
                        ></p-select>
                    </div>

                    <!-- Province -->
                    <div class="form-group">
                        <label for="provinceId" class="block text-sm font-medium mb-2">
                            {{ 'formLabels.province' | translate }}
                            <span class="text-red-500">*</span>
                        </label>
                        <p-select
                            formControlName="provinceId"
                            [options]="filteredProvinces"
                            optionLabel="nameAr"
                            optionValue="id"
                            [placeholder]="'formLabels.province' | translate"
                            [style]="{ width: '100%' }"
                        />
                    </div>

                    <!-- Affiliated Entity -->
                    <div class="form-group">
                        <label for="organizationId" class="block text-sm font-medium mb-2">
                            {{ 'formLabels.affiliatedEntity' | translate }}
                        </label>
                        <p-select
                            formControlName="organizationId"
                            [options]="filteredOrganizations"
                            optionLabel="nameAr"
                            optionValue="id"
                            [placeholder]="'formLabels.affiliatedEntity' | translate"
                            [style]="{ width: '100%' }"
                        ></p-select>
                    </div>

                    <!-- Location Classification -->
                    <div class="form-group">
                        <label
                            for="locationClassificationId"
                            class="block text-sm font-medium mb-2"
                        >
                            {{ 'locationClassification.name' | translate }}
                        </label>
                        <p-select
                            formControlName="locationClassificationId"
                            [options]="filteredLocationClassifications"
                            optionLabel="nameAr"
                            optionValue="id"
                            [placeholder]="'locationClassification.name' | translate"
                            [style]="{ width: '100%' }"
                        >
                            <ng-template pTemplate="selectedItem" let-option>
                                <div class="flex items-center gap-2">
                                    <span
                                        class="inline-block w-4 h-4 rounded"
                                        [style.backgroundColor]="option?.color"
                                        style="border: 1px solid #ddd"
                                    ></span>
                                    <span>{{ option?.nameAr }}</span>
                                </div>
                            </ng-template>
                            <ng-template pTemplate="item" let-option>
                                <div class="flex items-center gap-2">
                                    <span
                                        class="inline-block w-4 h-4 rounded"
                                        [style.backgroundColor]="option?.color"
                                        style="border: 1px solid #ddd"
                                    ></span>
                                    <span>{{ option?.nameAr }}</span>
                                </div>
                            </ng-template>
                        </p-select>
                    </div>

                    <!-- Site Type -->
                    <div class="form-group">
                        <label for="siteType" class="block text-sm font-medium mb-2">
                            {{ 'formLabels.siteType' | translate }}
                        </label>
                        <p-select
                            formControlName="siteType"
                            [options]="filteredSiteTypes"
                            optionLabel="label"
                            optionValue="id"
                            [placeholder]="'formLabels.siteType' | translate"
                            [style]="{ width: '100%' }"
                        />
                    </div>

                    <!-- تاريخ استلام الموقع - Site Receipt Date -->
                    <div class="form-group">
                        <label for="siteReceiptDate" class="block text-sm font-medium mb-2">
                            تاريخ استلام الموقع
                        </label>
                        <input
                            id="siteReceiptDate"
                            formControlName="siteReceiptDate"
                            mwlFlatpickr
                            [options]="dateBasicConfig"
                            pInputText
                            [altInput]="true"
                            [convertModelValue]="true"
                            class="w-full"
                        />
                    </div>

                    <!-- Coordinates -->
                    <div class="form-group">
                        <label for="siteCoordinates" class="block text-sm font-medium mb-2">
                            {{ 'formLabels.coordinates' | translate }}
                        </label>
                        <div class="flex gap-2">
                            <input
                                id="siteCoordinates"
                                type="text"
                                formControlName="siteCoordinates"
                                pInputText
                                class="w-full"
                                [placeholder]="'formLabels.coordinates' | translate"
                            />
                            <button
                                type="button"
                                class="btn btn-sm btn-outline-primary"
                                (click)="openMapDialog()"
                                title="Select from map"
                            >
                                <i class="pi pi-map-marker"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-span-1">
                <app-file-attachments
                    [attachments]="attachments"
                    helperText="الحد الأقصى لحجم الملف هو 2 ميجابايت والصيغ المدعومة: jpg, png, pdf."
                    [entityName]="'Location'"
                    [entityKey]="locationId ? locationId.toString() : ''"
                    [path]="'Location'"
                    [category]="'Documents'"
                    (fileAdded)="onFileAdded($event)"
                    (download)="onAttachmentDownload($event)"
                    (remove)="onAttachmentRemove($event)"
                    (uploadSuccess)="onUploadSuccess($event)"
                    (uploadError)="onUploadError($event)"
                />
            </div>
        </div>

        <!-- Tabs Section -->
        <p-tabs [value]="currentTabIndex">
            <p-tablist>
                <p-tab value="0">{{ 'formLabels.addNote' | translate }}</p-tab>
                <p-tab value="1">حدود الموقع</p-tab>
                <p-tab value="2">المقر الإداري أو الموقع</p-tab>
                <p-tab value="3">سجل الإجراءات</p-tab>
            </p-tablist>
            <p-tabpanels>
                <!-- Add Note -->
                <p-tabpanel value="0">
                    <div class="mt-4">
                        <div class="form-group">
                            <label for="descriptionAr" class="block text-sm font-medium mb-2">
                                {{ 'formLabels.description' | translate }}
                            </label>
                            <textarea
                                id="descriptionAr"
                                formControlName="descriptionAr"
                                pInputTextarea
                                rows="5"
                                class="w-full"
                                [placeholder]="'formLabels.enterDescription' | translate"
                            ></textarea>
                        </div>
                    </div>
                </p-tabpanel>

                <!-- حدود الموقع - Location Boundaries -->
                <p-tabpanel value="1">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                        <!-- الحد الشمالي - North Boundary -->
                        <div class="form-group">
                            <label for="northBoundar" class="block text-sm font-medium mb-2">
                                الحد الشمالي
                            </label>
                            <input
                                id="northBoundar"
                                type="text"
                                formControlName="northBoundar"
                                pInputText
                                class="w-full"
                            />
                        </div>

                        <!-- الحد الجنوبي - South Boundary -->
                        <div class="form-group">
                            <label for="southBoundar" class="block text-sm font-medium mb-2">
                                الحد الجنوبي
                            </label>
                            <input
                                id="southBoundar"
                                type="text"
                                formControlName="southBoundar"
                                pInputText
                                class="w-full"
                            />
                        </div>

                        <!-- الحد الغربي - West Boundary -->
                        <div class="form-group">
                            <label for="westBoundar" class="block text-sm font-medium mb-2">
                                الحد الغربي
                            </label>
                            <input
                                id="westBoundar"
                                type="text"
                                formControlName="westBoundar"
                                pInputText
                                class="w-full"
                            />
                        </div>

                        <!-- الحد الشرقي - East Boundary -->
                        <div class="form-group">
                            <label for="eastBoundar" class="block text-sm font-medium mb-2">
                                الحد الشرقي
                            </label>
                            <input
                                id="eastBoundar"
                                type="text"
                                formControlName="eastBoundar"
                                pInputText
                                class="w-full"
                            />
                        </div>

                        <!-- طول الموقع - Site Length -->
                        <div class="form-group">
                            <label for="siteLength" class="block text-sm font-medium mb-2">
                                طول الموقع
                            </label>
                            <input
                                id="siteLength"
                                type="text"
                                formControlName="siteLength"
                                pInputText
                                class="w-full"
                            />
                        </div>

                        <!-- أقرب مركز شرطة - Nearest Police Station -->
                        <div class="form-group">
                            <label
                                for="nearestPoliceStation"
                                class="block text-sm font-medium mb-2"
                            >
                                أقرب مركز شرطة
                            </label>
                            <input
                                id="nearestPoliceStation"
                                type="text"
                                formControlName="nearestPoliceStation"
                                pInputText
                                class="w-full"
                            />
                        </div>

                        <!-- أقرب مركز دفاع - Nearest Defense Center -->
                        <div class="form-group">
                            <label
                                for="nearestDefenseCenter"
                                class="block text-sm font-medium mb-2"
                            >
                                أقرب مركز دفاع
                            </label>
                            <input
                                id="nearestDefenseCenter"
                                type="text"
                                formControlName="nearestDefenseCenter"
                                pInputText
                                class="w-full"
                            />
                        </div>
                    </div>
                </p-tabpanel>

                <!-- المقر الإداري أو الموقع - Administrative Headquarters -->
                <p-tabpanel value="2">
                    <div class="mt-4">
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <!-- نوع المبنى - Building Type -->
                            <div class="form-group">
                                <label
                                    for="administrativeSiteType"
                                    class="block text-sm font-medium mb-2"
                                >
                                    نوع المبنى
                                </label>
                                <input
                                    id="administrativeSiteType"
                                    type="text"
                                    formControlName="administrativeSiteType"
                                    pInputText
                                    class="w-full"
                                    placeholder="نوع المبنى"
                                />
                            </div>

                            <!-- عدد المباني - Number of Buildings -->
                            <div class="form-group">
                                <label
                                    for="administrativeOfficeNumber"
                                    class="block text-sm font-medium mb-2"
                                >
                                    عدد المباني
                                </label>
                                <input
                                    id="administrativeOfficeNumber"
                                    type="number"
                                    formControlName="administrativeOfficeNumber"
                                    pInputText
                                    class="w-full"
                                    placeholder="المباني عدد"
                                />
                            </div>

                            <!-- دورة مياه - Bathrooms -->
                            <div class="form-group">
                                <label
                                    for="administrativeWCNumber"
                                    class="block text-sm font-medium mb-2"
                                >
                                    دورة مياه
                                </label>
                                <input
                                    id="administrativeWCNumber"
                                    type="number"
                                    formControlName="administrativeWCNumber"
                                    pInputText
                                    class="w-full"
                                    placeholder="عدد دورات المياه"
                                />
                            </div>

                            <!-- غرف الخدمات - Service Rooms -->
                            <div class="form-group">
                                <label for="serviceRooms" class="block text-sm font-medium mb-2">
                                    غرف الخدمات
                                </label>
                                <input
                                    id="serviceRooms"
                                    type="text"
                                    pInputText
                                    class="w-full"
                                    placeholder="غرف الخدمات"
                                />
                            </div>

                            <!-- عدد غرف الخدمات - Number of Service Rooms -->
                            <div class="form-group">
                                <label
                                    for="administrativeServiceNumber"
                                    class="block text-sm font-medium mb-2"
                                >
                                    عدد غرف الخدمات
                                </label>
                                <input
                                    id="administrativeServiceNumber"
                                    type="number"
                                    formControlName="administrativeServiceNumber"
                                    pInputText
                                    class="w-full"
                                    placeholder=" عدد غرف الخدمات"
                                />
                            </div>

                            <!-- نوع المبنى (second) -->
                            <div class="form-group">
                                <label
                                    for="administrativeSite"
                                    class="block text-sm font-medium mb-2"
                                >
                                    اسم المبنى
                                </label>
                                <input
                                    id="administrativeSite"
                                    type="text"
                                    formControlName="administrativeSite"
                                    pInputText
                                    class="w-full"
                                    placeholder="اسم المبنى"
                                />
                            </div>
                        </div>

                        <!-- Checkboxes Section -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
                            <!-- مستودع أسلحة - Weapons Warehouse -->
                            <div class="flex items-center gap-2">
                                <p-checkbox
                                    formControlName="weaponsWarehouse"
                                    [binary]="true"
                                    inputId="weaponsWarehouse"
                                />
                                <label for="weaponsWarehouse">مستودع أسلحة</label>
                            </div>

                            <!-- تحديد المساحة - Define Area -->
                            <div class="form-group">
                                <label for="warhouseArea" class="block text-sm font-medium mb-2">
                                    تحديد المساحة
                                </label>
                                <input
                                    id="warhouseArea"
                                    type="text"
                                    formControlName="warhouseArea"
                                    pInputText
                                    class="w-full"
                                />
                            </div>

                            <!-- ورشة صيانة - Maintenance Workshop -->
                            <div class="flex items-center gap-2">
                                <p-checkbox
                                    formControlName="maintainceWorkShop"
                                    [binary]="true"
                                    inputId="maintainceWorkShop"
                                />
                                <label for="maintainceWorkShop">ورشة صيانة</label>
                            </div>

                            <div></div>

                            <!-- يوجد مواقف للضباط والأفراد - Parking for Officers -->
                            <div class="flex items-center gap-2">
                                <p-checkbox
                                    formControlName="parkingSpaces"
                                    [binary]="true"
                                    inputId="parkingSpaces"
                                />
                                <label for="parkingSpaces">يوجد مواقف للضباط والأفراد</label>
                            </div>

                            <!-- عدد المواقف - Number of Parking Spaces -->
                            <div class="form-group">
                                <label
                                    for="parkingSpacesNumber"
                                    class="block text-sm font-medium mb-2"
                                >
                                    عدد المواقف
                                </label>
                                <input
                                    id="parkingSpacesNumber"
                                    type="number"
                                    formControlName="parkingSpacesNumber"
                                    pInputText
                                    class="w-full"
                                />
                            </div>
                        </div>

                        <!-- Additional Fields -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                            <!-- الموقع الإداري - Administrative Site -->
                            <div class="form-group">
                                <label
                                    for="administrativeSiteDistance"
                                    class="block text-sm font-medium mb-2"
                                >
                                    مسافة الموقع الإداري
                                </label>
                                <input
                                    id="administrativeSiteDistance"
                                    type="text"
                                    formControlName="administrativeSiteDistance"
                                    pInputText
                                    class="w-full"
                                />
                            </div>

                            <!-- Opening Date -->
                            <div class="form-group">
                                <label for="openingDate" class="block text-sm font-medium mb-2">
                                    {{ 'formLabels.openingDate' | translate }}
                                </label>
                                <input
                                    id="openingDate"
                                    type="text"
                                    formControlName="openingDate"
                                    mwlFlatpickr
                                    [options]="dateBasicConfig"
                                    pInputText
                                    [altInput]="true"
                                    [convertModelValue]="true"
                                    class="w-full"
                                />
                            </div>

                            <!-- عدد الموظفين - Staff Number -->
                            <div class="form-group">
                                <label for="staff" class="block text-sm font-medium mb-2">
                                    عدد الموظفين
                                </label>
                                <input
                                    id="staff"
                                    type="number"
                                    formControlName="staff"
                                    pInputText
                                    class="w-full"
                                />
                            </div>
                        </div>
                    </div>
                </p-tabpanel>

                <p-tabpanel value="3">
                    <div class="flex gap-4 w-full mt-4">
                        <!-- Logs List Component -->
                        <app-logs-list
                            tableName="Locations"
                            [tableKey]="locationId"
                            class="w-full"
                        />
                    </div>
                </p-tabpanel>
            </p-tabpanels>
        </p-tabs>
    </form>
</div>

<!-- Map Selection Dialog -->
<p-dialog
    [(visible)]="showMapDialog"
    [header]="'location.selectLocationFromMap' | translate"
    [modal]="true"
    [style]="{ width: '90vw' }"
    [maximizable]="true"
    [closeOnEscape]="true"
    (onShow)="onMapDialogShow()"
>
    <div class="h-full flex flex-col justify-between">
        <app-saudi-map
            *ngIf="showMapDialog"
            [initializeOnLoad]="false"
            (markerSelected)="onMapMarkerSelected($event)"
            class="flex-1"
        />
    </div>
    <!-- the actions should be in footer -->
    <ng-template #footer>
        <div class="flex gap-2 mt-4 justify-end">
            <button type="button" class="btn btn-outline" (click)="closeMapDialog()">
                {{ 'buttons.cancel' | translate }}
            </button>
            <button
                type="button"
                class="btn btn-primary"
                (click)="confirmMapSelection()"
                [disabled]="!selectedMarkerCoordinates"
            >
                {{ 'dataTable.confirm' | translate }}
            </button>
        </div>
    </ng-template>
</p-dialog>
