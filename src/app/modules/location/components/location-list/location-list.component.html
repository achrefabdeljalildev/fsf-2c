<p-breadcrumb
    [model]="[
        { label: 'الالكترونيات' },
        { label: 'الحاسوب' },
        { label: 'المواقع' },
        { label: 'الجرد' },
        { label: 'التنطيق' },
    ]"
/>
<div class="min-h-screen bg-slate-50" dir="rtl">
    <base-datatable
        [columns]="columns"
        [value]="users"
        [totalRecords]="users.length"
        [loading]="loading"
        [lazy]="true"
        (lazyLoad)="loadUsers($event)"
        (rowClick)="onRowSelected($event)"
    >
        <ng-template baseDatatableColumn="name" let-value="value">
            <span style="text-decoration: underline">{{ value }}</span>
        </ng-template>
    </base-datatable>
</div>
