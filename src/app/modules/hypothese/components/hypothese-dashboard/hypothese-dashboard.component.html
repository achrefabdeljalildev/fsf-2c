<p-breadcrumb
    [model]="[
        { label: ('breadcrumbs.securitySystems' | translate), routerLink: '/' },
        { label: ('breadcrumbs.generalAdministration' | translate), routerLink: '/' },
        { label: ('breadcrumbs.hypotheses' | translate), routerLink: '/' },
        { label: ('breadcrumbs.ControlManagement' | translate) },
    ]"
/>

<main-content [isPanel]="false">
    <!-- Top stat cards -->
    <div
        class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-4 bg-lightBlue-light p-4 rounded-lg"
    >
        <p-card *ngFor="let s of stats" class="rounded-2xl shadow-sm">
            <div class="flex flex-col items-center gap-3 py-2">
                <div class="flex h-14 w-14 items-center justify-center rounded-full bg-primary">
                    <img [src]="s.icon" alt="" />
                </div>

                <div class="text-4xl font-extrabold text-teal-800 leading-none">
                    {{ s.value }}
                </div>
                <div class="text-slate-600 text-sm font-semibold">
                    {{ s.label }}
                </div>
            </div>
        </p-card>
    </div>

    <!-- Middle panels -->
    <div class="mt-6 grid grid-cols-1 gap-4 xl:grid-cols-2">
        <!-- Action log -->
        <p-card class="rounded-2xl shadow-sm">
            <div class="flex items-center justify-between">
                <div class="text-slate-900 font-extrabold text-xl">الفرضيات المضافة حديثاً</div>
                <button
                    pButton
                    type="button"
                    class="p-button-text"
                    (click)="viewMore()"
                    label="عرض المزيد"
                ></button>
            </div>

            <div class="mt-4 space-y-3">
                <div
                    *ngFor="let a of actionLog"
                    class="group rounded-xl border border-gradient-to-r bg-gradient-to-br from-blue-50 via-white to-purple-50 p-4 shadow-sm hover:shadow-lg transition-all duration-300 cursor-pointer"
                >
                    <div class="flex items-center justify-between gap-3 mb-3">
                        <div class="flex items-center gap-3 flex-1">
                            <div class="flex items-center gap-2">
                                <span
                                    class="text-slate-900 font-extrabold cursor-pointer hover:text-green-600 transition-colors duration-200"
                                    (click)="clickName()"
                                >
                                    {{ a.name }}
                                </span>
                                <span class="text-slate-300">|</span>
                                <span
                                    class="text-slate-600 text-sm group-hover:text-slate-900 transition-colors"
                                    >{{ a.title }}</span
                                >
                                <span
                                    class="text-xs font-semibold text-green-700 bg-green-100 px-3 py-1 rounded-full flex items-center gap-1"
                                >
                                    <span class="w-2 h-2 bg-green-500 rounded-full"></span>
                                    تم إضافتها
                                </span>
                            </div>
                        </div>

                        <div
                            class="flex h-8 w-8 items-center justify-center rounded-full bg-gradient-to-br from-emerald-100 to-teal-100 text-emerald-600 flex-shrink-0"
                        >
                            <i class="pi pi-check-circle text-sm"></i>
                        </div>
                    </div>

                    <div
                        class="h-px bg-gradient-to-r from-blue-200 via-purple-200 to-transparent mb-3"
                    ></div>

                    <div class="flex items-center justify-between px-1">
                        <div class="flex items-center gap-2">
                            <i class="pi pi-map-marker text-red-500 text-sm"></i>
                            <span
                                class="text-slate-600 font-semibold text-sm cursor-pointer hover:text-red-600 transition-colors duration-200"
                                (click)="clickLocation()"
                            >
                                {{ a.locationCode }}
                            </span>
                        </div>
                        <div class="flex items-center gap-2">
                            <i class="pi pi-calendar text-blue-500 text-sm"></i>
                            <span class="text-slate-500 text-xs">{{ a.date }}</span>
                        </div>
                    </div>
                </div>
            </div>
        </p-card>
        <p-card class="rounded-2xl shadow-sm">
            <div class="flex items-center justify-between">
                <div class="text-slate-900 font-extrabold text-xl">الفرضيات المنتظرة للاجراء</div>
                <button
                    pButton
                    type="button"
                    class="p-button-text"
                    (click)="viewMore()"
                    label="عرض المزيد"
                ></button>
            </div>

            <div class="mt-4 space-y-3">
                <div
                    *ngFor="let a of actionLog"
                    class="group rounded-xl border border-gradient-to-r bg-gradient-to-br from-blue-50 via-white to-purple-50 p-4 shadow-sm hover:shadow-lg transition-all duration-300 cursor-pointer"
                >
                    <div class="flex items-center justify-between gap-3 mb-3">
                        <div class="flex items-center gap-3 flex-1">
                            <div class="flex items-center gap-2">
                                <span
                                    class="text-slate-900 font-extrabold cursor-pointer hover:text-green-600 transition-colors duration-200"
                                    (click)="clickName()"
                                >
                                    {{ a.name }}
                                </span>
                                <span class="text-slate-300">|</span>
                                <span
                                    class="text-slate-600 text-sm group-hover:text-slate-900 transition-colors"
                                    >{{ a.title }}</span
                                >
                                <span
                                    class="text-xs font-semibold text-amber-700 bg-amber-100 px-3 py-1 rounded-full flex items-center gap-1 transition-all"
                                >
                                    <span
                                        class="w-2 h-2 bg-amber-500 rounded-full animate-pulse"
                                    ></span>
                                    تحت الإجراء
                                </span>
                            </div>
                        </div>

                        <div
                            class="flex h-8 w-8 items-center justify-center rounded-full bg-gradient-to-br from-emerald-100 to-teal-100 text-emerald-600 flex-shrink-0"
                        >
                            <i class="pi pi-hourglass text-sm text-amber-500"></i>
                        </div>
                    </div>

                    <div
                        class="h-px bg-gradient-to-r from-blue-200 via-purple-200 to-transparent mb-3"
                    ></div>

                    <div class="flex items-center justify-between px-1">
                        <div class="flex items-center gap-2">
                            <i class="pi pi-map-marker text-red-500 text-sm"></i>
                            <span
                                class="text-slate-600 font-semibold text-sm cursor-pointer hover:text-red-600 transition-colors duration-200"
                                (click)="clickLocation()"
                            >
                                {{ a.locationCode }}
                            </span>
                        </div>
                        <div class="flex items-center gap-2">
                            <i class="pi pi-calendar text-blue-500 text-sm"></i>
                            <span class="text-slate-500 text-xs">{{ a.date }}</span>
                        </div>
                    </div>
                </div>
            </div>
        </p-card>
    </div>
</main-content>
