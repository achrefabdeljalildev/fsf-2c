<p-breadcrumb
    [model]="[
        { label: ('breadcrumbs.securitySystems' | translate), routerLink: '/' },
        { label: ('breadcrumbs.generalAdministration' | translate), routerLink: '/' },
        { label: ('breadcrumbs.hypotheses' | translate), routerLink: '/' },
        { label: ('breadcrumbs.ControlManagement' | translate) },
    ]"
/>

<main-content [isPanel]="false">
    <!-- Top stat cards -->
    <div class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-4 p-4 rounded-lg bg-primary">
        <p-card
            *ngFor="let s of stats"
            class="rounded-2xl shadow-md bg-green-800 text-white transition-shadow duration-200 hover:shadow-lg p-6"
        >
            <div class="text-5xl md:text-6xl font-extrabold leading-none">
                <div class="text-4xl font-extrabold text-teal-800 leading-none">
                    {{ s.value }}
                </div>
                <div class="text-slate-600 text-sm font-semibold">
                    {{ s.label }}
                </div>
            </div>
        </p-card>
    </div>
    <!-- Middle panels -->
    <div class="mt-6 grid grid-cols-1 gap-4 xl:grid-cols-2">
        <!-- Pending actions -->
        <p-card class="rounded-xl bg-white border border-slate-200 shadow-sm">
            <div class="flex items-center justify-between mb-4">
                <div class="text-slate-900 font-bold text-lg">الفرضيات بانتظار الإجراء</div>
                <button
                    pButton
                    type="button"
                    class="p-button-text text-sm"
                    (click)="viewMore()"
                    label="عرض المزيد"
                ></button>
            </div>

            <div>
                <div *ngFor="let a of actionLog; let last = last">
                    <!-- ROW -->
                    <div class="flex items-start justify-between gap-4">
                        <!-- Left -->
                        <div class="space-y-1">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span
                                    class="text-sm font-bold text-slate-800 cursor-pointer"
                                    (click)="clickName()"
                                >
                                    {{ a.name }}
                                </span>

                                <span
                                    class="text-[11px] font-semibold text-amber-700 bg-amber-100 px-2 py-0.5 rounded-full"
                                >
                                    تحت الإجراء
                                </span>
                            </div>

                            <p class="text-xs text-slate-500">
                                {{ a.title }}
                            </p>
                        </div>
                        <button
                            class="text-xs border border-slate-300 rounded-md px-3 py-1 text-slate-700"
                            (click)="router.navigate(['/hypothese/edit', a.id])"
                        >
                            تفاصيل
                        </button>
                    </div>
                    <div class="flex items-center gap-2 mt-1">
                        <span
                            class="inline-flex items-center gap-1.5 text-xs text-slate-600 border border-slate-300 rounded-md px-2.5 py-1 cursor-pointer hover:text-slate-800"
                        >
                            <img
                                src="/assets/images/icons/date-logo.svg"
                                alt="date"
                                class="w-4 h-4"
                            />
                            {{ a.date }}
                        </span>

                        <span
                            class="inline-flex items-center gap-1.5 text-xs text-slate-600 border border-slate-300 rounded-md px-2.5 py-1 cursor-pointer hover:text-slate-800"
                            (click)="clickLocation()"
                        >
                            <img
                                src="/assets/images/icons/location-logo-dashboard.svg"
                                alt="location"
                                class="w-4 h-4"
                            />
                            {{ a.locationCode }}
                        </span>
                    </div>

                    <!-- DIVIDER -->
                    <div *ngIf="!last" class="h-px bg-slate-200 my-4"></div>
                </div>
            </div>
        </p-card>

        <!-- Action log -->
        <p-card class="rounded-xl bg-white border border-slate-200 shadow-sm">
            <div class="flex items-center justify-between mb-4">
                <div class="text-slate-900 font-bold text-lg">سجل الاجراءات</div>
                <button
                    pButton
                    type="button"
                    class="p-button-text text-sm"
                    (click)="viewMore()"
                    label="عرض المزيد"
                ></button>
            </div>

            <div>
                <div *ngFor="let a of actionLog; let last = last">
                    <!-- ROW -->
                    <div class="flex items-start justify-between gap-4">
                        <!-- Left -->
                        <div class="space-y-1">
                            <div class="flex items-center gap-2 flex-wrap">
                                <img
                                    src="assets/images/icons/exclamation mark.svg"
                                    alt="alert"
                                    class="w-4 h-4 inline-block"
                                />
                                <span
                                    class="text-sm font-bold text-slate-800 cursor-pointer"
                                    (click)="clickName()"
                                >
                                    {{ a.name }}
                                </span>

                                <span
                                    class="text-[11px] font-semibold text-green-700 bg-green-100 px-2 py-0.5 rounded-full"
                                >
                                    تم إضافتها
                                </span>
                            </div>

                            <p class="text-xs text-slate-500">
                                {{ a.title }}
                            </p>
                        </div>

                        <!-- Right -->
                        <div class="flex flex-col items-end gap-2 shrink-0">
                            <span
                                class="text-xs text-slate-500 border border-slate-300 rounded-md px-2 py-0.5"
                            >
                                {{ a.date }}
                            </span>
                        </div>
                    </div>

                    <!-- DIVIDER -->
                    <div *ngIf="!last" class="h-px bg-slate-200 my-4"></div>
                </div>
            </div>
        </p-card>
    </div>
</main-content>
