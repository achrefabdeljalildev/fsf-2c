<p-dialog
    [(visible)]="visible"
    [header]="isEditMode ? ('actions.edit' | translate) : ('actions.addNew' | translate)"
    [modal]="true"
    [style]="{ width: '50vw' }"
    [breakpoints]="{ '960px': '75vw', '640px': '90vw' }"
    (onHide)="closeDialog()"
>
    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">
        <!-- Name in Arabic -->
        <div class="form-group">
            <label for="nameAr" class="block text-sm font-medium mb-2">
                {{ 'formLabels.name' | translate }}
                <span class="text-red-500">*</span>
            </label>
            <input
                id="nameAr"
                type="text"
                formControlName="nameAr"
                pInputText
                class="w-full"
                [placeholder]="'formLabels.enterName' | translate"
            />
            <small
                *ngIf="
                    form.get('nameAr')?.invalid &&
                    (form.get('nameAr')?.dirty || form.get('nameAr')?.touched)
                "
                class="text-red-500"
            >
                <span *ngIf="form.get('nameAr')?.errors?.['required']">
                    {{ 'messages.requiredField' | translate }}
                </span>
            </small>
        </div>

        <!-- Description in Arabic -->
        <div class="form-group">
            <label for="descriptionAr" class="block text-sm font-medium mb-2">
                {{ 'formLabels.description' | translate }}
            </label>
            <textarea
                id="descriptionAr"
                formControlName="descriptionAr"
                pInputTextarea
                rows="5"
                class="w-full"
                [placeholder]="'formLabels.enterDescription' | translate"
            ></textarea>
        </div>

        <button
            type="button"
            pButton
            pRipple
            [label]="'actions.cancel' | translate"
            icon="pi pi-times"
            class="p-button-text"
            (click)="closeDialog()"
        ></button>
        <button
            type="submit"
            pButton
            pRipple
            [label]="'actions.save' | translate"
            icon="pi pi-check"
            [loading]="isLoading"
            [disabled]="form.invalid || isLoading"
        ></button>
    </form>
</p-dialog>
