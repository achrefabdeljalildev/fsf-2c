<p-breadcrumb
    [model]="[
        { label: ('breadcrumbs.securitySystems' | translate), routerLink: '/' },
        { label: ('globalSettings.globalSettings' | translate), routerLink: '/' },
        { label: ('users.userList' | translate) },
    ]"
/>

<main-content>
    <list-header
        addNewRecordLabel="{{ 'users.addNewUser' | translate }}"
        tableTitle="{{ 'users.userList' | translate }}"
        [paginationInfo]="paginationInfo"
        [pageNumber]="criteria.pageNumber"
        [pageSize]="criteria.pageSize"
        [totalCount]="criteria.totalCount ?? 0"
        (search)="onSearch($event)"
        (addNewRecord)="openCreateDialog()"
        (pageChange)="onPageChange($event)"
    />

    <ng-datatable
        [rows]="rows"
        [columns]="cols"
        [hasCheckbox]="true"
        [sortable]="false"
        [loading]="isLoading"
        [pagination]="true"
        [pageSize]="criteria.pageSize"
        rowClass="cursor-pointer"
        noDataContent="{{ 'common.noDataOnList' | translate }}"
    >
        <ng-template slot="actions" let-value="data">
            <div class="flex gap-2 items-center">
                <div
                    (click)="openRoleDialog(value.id)"
                    class="cursor-pointer flex items-center gap-2 btn btn-primary btn-sm truncate"
                >
                    <i class="pi pi-list-check"></i> الادوار
                </div>
            </div>
        </ng-template>
    </ng-datatable>
</main-content>

<app-user-view [(visible)]="showDialog" [userId]="selectedUserId" (onSave)="onDialogSave()" />

<app-user-roles-dialog
    [(visible)]="showRolesDialog"
    [userId]="selectedUserIdForRoles"
    (onSave)="onRolesSave($event)"
/>
