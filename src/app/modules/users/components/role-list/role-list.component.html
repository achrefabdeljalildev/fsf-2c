<p-confirmDialog />

<p-breadcrumb
    [model]="[
        { label: ('breadcrumbs.securitySystems' | translate), routerLink: '/' },
        { label: ('globalSettings.globalSettings' | translate), routerLink: '/' },
        { label: ('users.roles' | translate) },
    ]"
/>

<main-content>
    <list-header
        tableTitle="{{ 'users.roles' | translate }}"
        [paginationInfo]="paginationInfo"
        [pageNumber]="criteria.pageNumber"
        [pageSize]="criteria.pageSize"
        [totalCount]="criteria.totalCount ?? 0"
        (addNewRecord)="openCreateDialog()"
        (search)="onSearch($event)"
        (pageChange)="onPageChange($event)"
    >
        <ng-datatable
            [rows]="rows"
            [columns]="cols"
            [hasCheckbox]="true"
            [sortable]="false"
            [loading]="isLoading"
            [pagination]="true"
            [pageSize]="criteria.pageSize"
            rowClass="cursor-pointer"
            noDataContent="{{ 'common.noDataOnList' | translate }}"
        >
            <ng-template slot="actions" let-value="data">
                <div class="flex gap-2">
                    <div
                        (click)="openEditDialog(value); $event.stopPropagation()"
                        class="cursor-pointer"
                        title="{{ 'buttons.edit' | translate }}"
                    >
                        <i class="pi pi-pencil"></i>
                    </div>
                    <div
                        (click)="openPermissionsDialog(value)"
                        class="cursor-pointer"
                        title="{{ 'users.managePermissions' | translate }}"
                    >
                        <i class="pi pi-shield"></i>
                    </div>
                </div>
            </ng-template>
        </ng-datatable>
    </list-header>
</main-content>

<app-role-view [(visible)]="showDialog" [role]="selectedRole" (onSave)="onDialogSave()" />

<p-dialog
    [(visible)]="showPermissionsDialog"
    [modal]="true"
    [draggable]="false"
    [resizable]="false"
    [style]="{ width: '700px' }"
    header="{{ 'users.managePermissions' | translate }} - {{ selectedRole?.name }}"
>
    <div class="py-2">
        <div *ngIf="loadingPermissions" class="flex items-center flex-col justify-center py-8">
            <p-skeleton height="2rem" styleClass="mb-2"></p-skeleton>
            <p-skeleton height="2rem" styleClass="mb-2"></p-skeleton>
            <p-skeleton height="2rem" styleClass="mb-2"></p-skeleton>
            <p-skeleton height="2rem" styleClass="mb-2"></p-skeleton>
            <p-skeleton height="2rem" styleClass="mb-2"></p-skeleton>
            <p-skeleton height="2rem" styleClass="mb-2"></p-skeleton>
            <p-skeleton height="2rem" styleClass="mb-2"></p-skeleton>
        </div>
        <p-tree
            *ngIf="!loadingPermissions"
            [value]="treeNodes"
            selectionMode="checkbox"
            class="w-full md:w-[30rem]"
            [(selection)]="selectedNodes"
        >
            <ng-template let-node pTemplate="default">
                <div class="flex items-center gap-2">
                    <!-- <i
                        *ngIf="node.data?.type === 'menu'"
                        class="pi pi-folder"
                        [ngClass]="{
                            'text-primary': node.data.isAllowed,
                            'text-gray-400': !node.data.isAllowed,
                        }"
                    ></i>
                    <i
                        *ngIf="node.data?.type === 'form'"
                        class="pi pi-file"
                        [ngClass]="{
                            'text-blue-500': node.data.isAllowed,
                            'text-gray-400': !node.data.isAllowed,
                        }"
                    ></i> -->
                    <span>{{ node.label }}</span>
                    <span *ngIf="node.data?.code" class="text-xs text-gray-500 ml-2"
                        >({{ node.data.code }})</span
                    >
                </div>
            </ng-template>
        </p-tree>
    </div>
    <ng-template pTemplate="footer">
        <button
            class="btn btn-secondary"
            type="button"
            (click)="showPermissionsDialog = false"
            [disabled]="saveLoadingPermissions"
        >
            {{ 'buttons.close' | translate }}
        </button>
        <button
            class="btn btn-primary ms-2"
            type="button"
            (click)="savePermissions()"
            [disabled]="saveLoadingPermissions"
        >
            <span *ngIf="!saveLoadingPermissions">{{ 'buttons.save' | translate }}</span>
            <span *ngIf="saveLoadingPermissions">{{ 'common.loading' | translate }}</span>
        </button>
    </ng-template>
</p-dialog>
